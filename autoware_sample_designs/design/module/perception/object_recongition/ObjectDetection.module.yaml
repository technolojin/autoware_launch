autoware_system_design_format: 0.3.0

name: ObjectDetection.module

instances:
  # lidar ml (centerpoint)
  - name: centerpoint
    entity: LidarCenterpoint.module

  # lidar cluster on the semantically segmented cloud
  - name: clustering
    entity: LidarLabelBasedClustering.module

subscribers:
  - name: pointcloud
  - name: segmented_pointcloud
publishers:
  - name: lidar_clustering_objects
  - name: lidar_ml_objects

connections:
  # centerpoint
  - - subscriber.pointcloud
    - centerpoint.subscriber.pointcloud
  - - centerpoint.publisher.detected_objects
    - publisher.lidar_ml_objects

  # clustering
  - - subscriber.segmented_pointcloud
    - clustering.subscriber.segmented_pointcloud
  - - clustering.publisher.detected_objects
    - publisher.lidar_clustering_objects
