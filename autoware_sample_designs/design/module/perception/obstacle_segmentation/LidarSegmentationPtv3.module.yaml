autoware_system_design_format: 0.3.1

name: LidarSegmentationPtv3.module

instances:
  - name: ptv3
    entity: PTv3.node

subscribers:
  # lidar
  - name: concatenated_pointcloud
publishers:
  - name: pointcloud
  - name: segmented_pointcloud

connections:
  - - subscriber.concatenated_pointcloud
    - ptv3.subscriber.pointcloud
  - - ptv3.publisher.pointcloud_filtered
    - publisher.pointcloud
  - - ptv3.publisher.pointcloud_segmentation
    - publisher.segmented_pointcloud
