# This file is managed by sync-params workflow.
# Keys marked with '{OVERRIDE}' or '# {OVERRIDE: reason}' are persisted as variant overrides.
# 'reason' can be any single-line text without braces.
# To keep local changes, annotate fields with '# {OVERRIDE}' or '# {OVERRIDE: reason}'.
#
# Source: https://github.com/autowarefoundation/autoware_universe/blob/e9d43e45ca477ec70e58421be59cebf867f11f5e/perception/autoware_image_projection_based_fusion/config/fusion_common.param.yaml

/**:
  ros__parameters:
    # Example of lidar and camera timestamps
    # cloud timestamp: 0.009
    # rois timestamp: 0.107, 0.156, 0.087, 0.071, 0.124, 0.141
    # rois_timestamp_offsets: [0.098, 0.147, 0.078, 0.062, 0.115, 0.132]
    rois_timestamp_offsets: [-0.010, 0.015, 0.065, 0.040, 0.040, 0.040, 0.040, 0.0733, 0.0067]
    rois_timeout_sec: 0.5
    msg3d_timeout_sec: 0.05
    image_buffer_size: 15
    # projection setting for each ROI whether unrectify image
    # point_project_to_unrectified_image: [false, false, false, false, false, false]
    point_project_to_unrectified_image: [false, false, false, true, true, true, true, true, true]
    filter_scope_min_x: -100.0
    filter_scope_min_y: -100.0
    filter_scope_min_z: -100.0
    filter_scope_max_x: 100.0
    filter_scope_max_y: 100.0
    filter_scope_max_z: 100.0

    # camera cache setting for each ROI
    # approximate_camera_projection: [true, true, true, true, true, true]
    approximate_camera_projection: [true, true, true, true, true, true, true, true, true]
    # grid size in pixels
    approximation_grid_cell_width: 3.0
    approximation_grid_cell_height: 3.0

    # debug parameters
    debug_mode: false
    collector_debug_mode: false
    publish_processing_time_detail: false

    publish_previous_but_late_output_msg: false
    rosbag_length: 10.0
    # matching strategy
    matching_strategy:
      type: advanced
      # type: naive
      threshold: 0.05
      msg3d_noise_window: 0.02
      # rois_timestamp_noise_window: [0.01, 0.01, 0.01, 0.01, 0.01, 0.01]
      rois_timestamp_noise_window: [0.01, 0.01, 0.01, 0.01, 0.01, 0.01, 0.01, 0.01, 0.01]
